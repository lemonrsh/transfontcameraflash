name: Build Front Flash packages

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the Magisk ZIP as a direct GitHub Release download
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build-packages:
    name: Build tester APK and Magisk module
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [[ ! -d "$SDK_ROOT" ]]; then
            echo "Android SDK directory not found: $SDK_ROOT" >&2
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER="$(command -v sdkmanager || true)"
          if [[ -z "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print 2>/dev/null | sort -V | tail -n 1 || true)"
          fi
          if [[ -z "$SDKMANAGER" || ! -x "$SDKMANAGER" ]]; then
            echo "sdkmanager not found in $SDK_ROOT" >&2
            exit 1
          fi

          "$SDKMANAGER" --licenses <<< $'y\ny\ny\ny\ny\ny\ny\ny\ny\ny'
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Build APKs and Magisk module
        run: |
          ./gradlew --no-daemon :app:assembleDebug :tile:assembleDebug
          bash scripts/build-magisk-module.sh

      - name: Upload diagnostic APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: front-flash-tester-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Magisk module artifact
        uses: actions/upload-artifact@v4
        with:
          name: front-flash-quick-settings-magisk-module
          path: build/magisk/FrontFlashQuickSettings-v*.zip
          if-no-files-found: error
          retention-days: 14

  publish-direct-module-release:
    name: Publish direct Magisk module download
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release }}
    needs: build-packages
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download packaged Magisk module
        uses: actions/download-artifact@v4
        with:
          name: front-flash-quick-settings-magisk-module
          path: module-release

      - name: Publish direct-download Magisk module release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          MODULE="$(find module-release -maxdepth 1 -type f -name 'FrontFlashQuickSettings-v*.zip' -print -quit)"
          if [[ -z "$MODULE" ]]; then
            echo "Magisk module was not found in the downloaded artifact." >&2
            exit 1
          fi
          VERSION="$(basename "$MODULE" | sed -n 's/^FrontFlashQuickSettings-v\(.*\)\.zip$/\1/p')"
          TAG="frontflash-quicksettings-v${VERSION}"
          NOTES="Install this exact ZIP from the Magisk app, then reboot. It is a Magisk module; unlike a GitHub Actions artifact, it is not wrapped in another ZIP."

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$MODULE" --clobber
          else
            gh release create "$TAG" "$MODULE" \
              --target "$GITHUB_SHA" \
              --title "Front Flash Quick Settings v${VERSION}" \
              --notes "$NOTES"
          fi
