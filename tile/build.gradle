plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.lemonrsh.frontflashqs'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.lemonrsh.frontflashqs'
        // TileService was introduced in Android 7.0 (API 24).
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
